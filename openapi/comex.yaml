# =============================================================================
# API Comex — EURUS PRO
# OpenAPI 3.1 spec
#
# ALCANCE DE ESTE DOCUMENTO
#   Describe el comportamiento del backend: lo que la Cloud Function devuelve
#   de verdad, campo por campo. NO describe la configuración del API Gateway,
#   que es un spec Swagger 2.0 aparte y expone estas rutas por un catch-all
#   (`/{proxy=**}`) en lugar de declararlas una por una. Si algo difiere entre
#   ambos, el que manda para el integrador es este.
#
#   La forma de la respuesta está verificada contra la implementación, no
#   inferida. Ver `docs/api-contract/dispatch-files.md` en el repositorio
#   `api-comex-external`.
#
# NOTAS DE AUTENTICACIÓN Y RUTA
#   - La autenticación es por query param `?key=<API_KEY>`, no por header
#     Authorization: es el estándar de Google Cloud API Gateway.
#   - El `idAgencia` asignado por EURUS PRO va antes del segmento `/v1`, y se
#     modela como variable de servidor.
# =============================================================================

openapi: 3.1.0
info:
  title: API Comex — EURUS PRO
  version: "2.1.0"
  description: |
    API REST de Comercio Exterior de EURUS PRO. Permite consultar los
    documentos asociados a despachos de importación y exportación
    gestionados por una agencia EURUS PRO.

    **Autenticación**: todas las llamadas requieren enviar un API Key como
    parámetro de query `?key=<API_KEY>`. Este es el mecanismo estándar de
    Google API Gateway.

    **Identificación**: los endpoints bajo `/dispatch/*` requieren además el
    parámetro `rut` del cliente final
    (ver [Convenciones → RUT](/docs/conventions#formato-de-rut)). Los de
    `/master/*` no lo reciben: son catálogos de la agencia, no datos de un
    cliente.

    ## Antes de integrar: tres cosas que conviene saber

    Las tres aplican a los endpoints de `/dispatch/*`, que son los que
    devuelven documentos. Los de `/master/*` declaran su propio
    comportamiento en cada operación, y en al menos un punto es el contrario:
    emiten las claves sin valor como `null` en vez de eliminarlas.

    1. **La presencia de una clave no está garantizada.** Antes de serializar,
       la API elimina toda propiedad cuyo valor sea `null`, `undefined` o
       `""`. Un campo presente en un elemento puede faltar en el siguiente
       de la misma respuesta. Solo `id`, `isActive`, `dispatch` e `infoDoc`
       se emiten siempre.
    2. **`dispatch` e `infoDoc` siempre existen, pero pueden venir vacíos**, y
       un objeto vacío es *truthy* en JavaScript. Verifica contenido
       (`item.infoDoc?.document?.number`), no presencia (`item.infoDoc`).
    3. **La `url` de descarga caduca en 1 hora.** No la almacenes más allá de
       ese plazo: vuelve a consultar el endpoint.

    Las tres están explicadas en detalle en
    [Convenciones](/docs/conventions).
  contact:
    name: EURUS PRO
    url: https://eurus.pro
    email: api@eurus.pro
  license:
    name: Propietaria
    url: https://eurus.pro

servers:
  - url: https://api-comex.eurus.pro/{idAgencia}/v1
    description: Producción
    variables:
      idAgencia:
        default: YOUR_AGENCY_ID
        description: |
          Identificador de tu agencia asignado por EURUS PRO. Se incluye
          como primer segmento del path en todas las llamadas.

tags:
  - name: Seguimiento
    description: |
      Estado y trazabilidad de los despachos de comercio exterior.
  - name: Documentación
    description: |
      Consulta de documentos y archivos asociados a despachos de comercio
      exterior (facturas, packing list, BL, certificados, etc.).
  - name: Maestros
    description: |
      Catálogos de la agencia: listas de valores que el resto de los
      endpoints acepta como parámetro. Son de **baja rotación**, no
      inmutables — la agencia puede habilitar o dar de baja entradas—, así
      que conviene consultarlos al inicio del proceso y cachearlos por un
      rato, no fijarlos en el código ni suponer que dos llamadas del mismo
      día devuelven exactamente lo mismo.

components:
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: |
        API Key provista por EURUS PRO. Debe enviarse como query parameter
        en todas las llamadas (`?key=<API_KEY>`), siguiendo el estándar de
        Google Cloud API Gateway.

  parameters:
    RutParam:
      name: rut
      in: query
      required: true
      schema:
        type: string
        pattern: '^(?:[1-9]\d{0,8}|[1-9]\d{0,2}(?:\.\d{3})*)-?[\dkK]$'
      description: |
        RUT del cliente final, **cuerpo más dígito verificador**.

        Se aceptan estas formas, todas equivalentes:

        | Entrada | Se consulta como |
        |---|---|
        | `999999999` | `999999999` |
        | `99999999-9` | `999999999` |
        | `99.999.999-9` | `999999999` |
        | `99999999K` / `99999999-k` | `999999991` (la `K` vale `1`) |

        Se rechaza con `400 RUT_NUMBER_INVALID` lo que no es un RUT:
        notación científica (`1e2`), hexadecimal (`0x7B`), decimales
        (`123.0`), signo, cero inicial y puntos que no sean los separadores
        de miles del cuerpo.

        El largo **no** se valida: el RUT existe o no existe como cliente.

        **El RUT acota lo que ves.** Solo se devuelven despachos de la cuenta
        a la que resuelve, y sus documentos. Un despacho de otra cuenta
        responde `404`, igual que uno inexistente — ver la respuesta `404`.
      example: "999999999"

    FileTypeNameOptional:
      name: fileTypeName
      in: query
      required: false
      schema:
        type: string
      description: |
        Tipo de documento a filtrar. Filtro **exacto**: debe coincidir
        carácter por carácter con el valor que la respuesta devuelve en el
        campo `name`. Si se omite, se retornan todos los documentos
        asociados al despacho.

        Se recortan los espacios al inicio y al final antes de filtrar, así
        que un `%20` sobrante no deja la respuesta vacía.

        **URL encoding**: los valores contienen espacios y, en algunos casos,
        paréntesis y barras. Deben enviarse **URL-encoded**:

          - `FACTURA AGENCIA` → `FACTURA%20AGENCIA`
          - `CONOCIMIENTO DE EMBARQUE (B/L)` → `CONOCIMIENTO%20DE%20EMBARQUE%20%28B%2FL%29`

        Los helpers `URLSearchParams` (JS) y `params={}` (Python `httpx` /
        `requests`) hacen esta codificación automáticamente.

        Valores actualmente habilitados:
          - `FACTURA AGENCIA`
          - `FACTURA TERCEROS`
          - `NOTA DE COBRO`
          - `CERTIFICADO DE ORIGEN`
          - `CONOCIMIENTO DE EMBARQUE (B/L)`
      example: FACTURA AGENCIA

    FileTypeNameRequired:
      name: fileTypeName
      in: query
      required: true
      schema:
        type: string
      description: |
        Tipo de documento a filtrar. **Obligatorio** en este endpoint: sin él
        la respuesta es `400 FILE_TYPE_NAME_INVALID`.

        Mismas reglas que en el endpoint por despacho: filtro exacto contra
        el campo `name` de la respuesta, se recortan los espacios, y debe
        enviarse URL-encoded. Ver la lista de valores soportados en el
        parámetro `fileTypeName` de
        `GET /dispatch/files/{numeroDespacho}`.
      example: FACTURA AGENCIA

    StartDateParam:
      name: startDate
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}( \d{2}:\d{2})?$'
      description: |
        Inicio del rango de búsqueda, en `YYYY-MM-DD` o `YYYY-MM-DD HH:mm`.

        Las fechas se interpretan en **`America/Santiago`**, no en UTC. Sin
        hora, el inicio se ancla a `00:00:00.000` de ese día en esa zona.

        Se rechaza una fecha que no existe en el calendario (`2026-02-30`).
      example: "2026-01-01"

    EndDateParam:
      name: endDate
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}( \d{2}:\d{2})?$'
      description: |
        Fin del rango de búsqueda, en `YYYY-MM-DD` o `YYYY-MM-DD HH:mm`.

        Se interpreta en **`America/Santiago`**. Sin hora, el fin se ancla a
        `23:59:59.999` de ese día, de modo que un rango por día cubra el día
        completo: la comparación es inclusiva en ambos extremos.

        Si `startDate` es mayor que `endDate`, la respuesta es
        `400 DATE_RANGE_INVALID`.
      example: "2026-01-31"

    RecordTypeParam:
      name: recordType
      in: query
      required: false
      schema:
        type: string
      description: |
        Filtra por tipo de registro. Valores observados: `din` (importación),
        `dus` (exportación), `smda`. El filtro es exacto.
      example: din

    IsCompletedParam:
      name: isCompleted
      in: query
      required: false
      schema:
        type: boolean
      description: |
        Filtra por despachos cerrados (`true`) o abiertos (`false`). Omite el
        parámetro para no filtrar por este campo.
      example: false

    StatusOrderByParam:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum: [lastModifiedDate, createdDate, recordType, isCompleted]
        default: lastModifiedDate
      description: |
        Campo de ordenamiento. Los valores soportados son los del `enum`.

        Hoy la API tolera un valor fuera de esa lista y ordena por
        `lastModifiedDate`, pero **ese comportamiento no es parte del
        contrato**: un valor no soportado puede pasar a responder `400` sin
        aviso previo. Envía siempre uno de los valores del `enum`.
      example: createdDate

    StatusOrderDirectionParam:
      name: orderDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: |
        Dirección del ordenamiento. Los valores soportados son `asc` y `desc`.

        Hoy la API trata cualquier otro valor como `desc`, pero **ese
        comportamiento no es parte del contrato** y puede pasar a responder
        `400` sin aviso previo.
      example: desc

    StatusLimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: |
        Cantidad máxima de despachos a devolver. El rango soportado es 1–200 y
        el valor por defecto es 50.

        Hoy la API aplica ese valor por defecto cuando recibe un número fuera
        de rango o un valor no numérico, pero **ese comportamiento no es parte
        del contrato** y puede pasar a responder `400` sin aviso previo.

        Este endpoint **no tiene paginación por cursor**: 200 es el techo duro
        por respuesta. Si necesitás más despachos, acotá con `recordType`,
        `isCompleted` o consultá por número de despacho.
      example: 50

    NextTokenParam:
      name: nextToken
      in: query
      required: false
      schema:
        type: string
      description: |
        Cursor de paginación: el valor `nextToken` que devolvió la respuesta
        anterior. Se omite para pedir la primera página.

        **Si el token no corresponde a un documento existente se responde
        `400 NEXT_TOKEN_INVALID`.** Puede pasar si el documento ancla se
        eliminó mientras recorrías las páginas.

        Antes ese caso se ignoraba en silencio y se devolvía la primera
        página, lo que hacía que un recorrido largo reiniciara y volviera a
        procesar lo ya procesado, duplicando datos sin ninguna señal.

        La condición de corte de tu bucle sigue siendo la **ausencia** de
        `nextToken` en la respuesta, nunca comparar el contenido de dos
        páginas.
      example: SqboswZtrqP1mDJl6dFj

    MasterRecordTypeParam:
      name: recordType
      in: query
      required: false
      schema:
        type: string
        enum: [impo, expo]
      description: |
        Tipo de operación por el que filtrar el maestro. **Opcional**: si se
        omite, se devuelven los tipos documentales de importación y de
        exportación juntos.

        | Valor | Devuelve |
        |---|---|
        | `impo` | Tipos documentales de **importación** (DIN). |
        | `expo` | Tipos documentales de **exportación** (DUS). |
        | *(omitido)* | Ambos. |

        El `enum` fija las **dos formas canónicas**, que son las que este
        contrato compromete y las que conviene enviar: un cliente generado
        desde este spec no necesita emitir ninguna otra.

        Por tolerancia, el backend además acepta cualquier capitalización
        (`IMPO`, `Impo`) y trata un valor vacío (`?recordType=`) como
        omitido. Son comportamientos que no se rompen, pero quedan fuera del
        `enum` a propósito: ampliarlo con cada variante de mayúsculas
        ensuciaría el contrato y los SDK generados sin agregar capacidad.

        Cualquier otro valor —incluidos `din` y `dus`, que son la
        nomenclatura interna— se rechaza con `400 RECORD_TYPE_INVALID`.

        Si el parámetro llega **repetido con valores distintos**
        (`?recordType=impo&recordType=expo`) también se rechaza con `400`:
        la API no elige uno ni asume "ambos".
      example: impo

  schemas:
    Error:
      type: object
      required: [status, code, message, requestId]
      properties:
        status:
          type: integer
          example: 400
          description: |
            Código HTTP, repetido en el cuerpo para facilitar el logging del
            integrador.
        code:
          type: string
          example: RUT_NUMBER_INVALID
          description: |
            Código de error estable. Es el valor a discriminar en el código
            del cliente; `message` puede cambiar de redacción.
        message:
          type: string
          example: >-
            The RUT parameter is required and must include the check digit.
          description: |
            Descripción legible del error, en inglés. No está pensada para
            mostrarse al usuario final sin traducir.
        requestId:
          type: string
          example: 6b3f5c8e-1234-4abc-9def-0123456789ab
          description: |
            Identificador único de la invocación. Se emite en **todos** los
            errores, incluidos los de autenticación, y se devuelve además en
            el header `X-Request-Id`. **Inclúyelo al reportar una incidencia
            a soporte.**

    InfoDocParty:
      type: object
      additionalProperties: true
      description: |
        Emisor o receptor del documento, según lo extrajo la IA. Abierto a
        propiedades adicionales: no todos los tipos de documento traen los
        mismos datos.
      properties:
        id:
          type: string
          description: Identificador tributario tal como aparece en el documento.
          example: "999999999"
        name:
          type: string
          description: Razón social.
          example: IMPORTADORA DEMO SPA
        giro:
          type: string
          description: Giro comercial, cuando el documento lo declara.
          example: COMERCIO AL POR MAYOR
        city:
          type: string
          description: Ciudad, cuando el documento la declara.
          example: SANTIAGO
        address:
          type: string
          description: Dirección, cuando el documento la declara.
          example: AV. DEMO 1234

    InfoDoc:
      type: object
      additionalProperties: true
      description: |
        Datos extraídos del documento mediante IA.

        **Siempre presente, posiblemente vacío (`{}`).** Y como `{}` es
        *truthy*, hay que verificar contenido y no presencia:
        `item.infoDoc?.document?.number`.

        **Deliberadamente abierto**: hay más de 187 tipos de documento y no
        todos están mapeados. Un comprobante puede no traer `customer`; una
        factura puede no traer `giro`. Ningún subobjeto está garantizado.

        Los valores de aquí **no** están normalizados por la API: provienen
        de la extracción, tal cual.
      properties:
        document:
          type: object
          additionalProperties: true
          description: Datos del documento propiamente tal.
          properties:
            number:
              type: string
              description: Folio o número del documento.
              example: "45"
            type:
              type: string
              description: Tipo de documento según la extracción.
              example: FACTURA ELECTRONICA
            issueDate:
              type: string
              description: |
                Fecha de emisión **como string de la extracción**. No es un
                timestamp normalizado por la API y su formato no está
                garantizado.
              example: "2026-01-05"
            dueDate:
              type: string
              description: |
                Fecha de vencimiento, con la misma advertencia que
                `issueDate`.
              example: "2026-02-04"
        issuer:
          $ref: '#/components/schemas/InfoDocParty'
        customer:
          $ref: '#/components/schemas/InfoDocParty'

    DispatchRef:
      type: object
      additionalProperties: false
      description: |
        Referencia al despacho. **Siempre presente, posiblemente vacía
        (`{}`)**: el contenedor se emite aunque ambas propiedades se hayan
        eliminado por venir vacías.
      properties:
        id:
          type: string
          description: ID del despacho referenciado.
          example: "123457"
        referencia:
          type: string
          description: |
            Referencia interna del despacho.

            **Solo en `GET /dispatch/files/{numeroDespacho}`.** El endpoint
            por rango y fecha no lee el documento del despacho, así que ahí
            esta propiedad nunca aparece. Es una divergencia real entre los
            dos endpoints, no una omisión de este documento.
          example: REF-DEMO-0001

    DispatchFile:
      type: object
      additionalProperties: false
      required: [id, isActive, dispatch, infoDoc]
      description: |
        Documento asociado a un despacho.

        Solo los cuatro campos de `required` se emiten siempre. El resto
        **desaparece del JSON** cuando su valor es vacío, y puede variar
        entre elementos de la misma respuesta.
      properties:
        id:
          type: string
          description: |
            ID del documento. Es el valor que se usa como `nextToken` para
            pedir la página siguiente.
          example: SqboswZtrqP1mDJl6dFj
        isActive:
          type: boolean
          description: |
            Si el documento está activo. Se emite siempre, al menos como
            `false`.
          example: true
        dispatch:
          $ref: '#/components/schemas/DispatchRef'
        infoDoc:
          $ref: '#/components/schemas/InfoDoc'
        name:
          type: string
          description: |
            **Tipo** de documento, no nombre de archivo. Es el mismo valor
            que se envía en `fileTypeName`.
          example: FACTURA AGENCIA
        numeroDespacho:
          type: string
          description: |
            Número de despacho del negocio. Si el documento no lo trae, cae
            al ID de la referencia al despacho.
          example: "123457"
        url:
          type: string
          format: uri
          description: |
            URL de descarga del documento, **con vigencia de 1 hora**. No
            debe almacenarse ni cachearse más allá de ese plazo: para
            obtener una nueva hay que volver a consultar el endpoint.

            **Puede faltar por dos motivos distintos**: el documento no
            tiene archivo asociado, o la URL no se pudo firmar. Los dos casos
            se distinguen por `unsignedCount` en el envelope, que cuenta solo
            los segundos.
          example: https://storage.googleapis.com/demo-bucket/files/45.pdf?X-Goog-Signature=...

    DispatchFilesResponse:
      type: object
      additionalProperties: false
      required: [date, data]
      properties:
        date:
          type: string
          format: date-time
          description: |
            **Instante en que se sirvió la respuesta**, en ISO 8601 UTC. No
            es una fecha del dato: no es la emisión del documento ni el
            rango consultado.
          example: "2026-01-31T22:04:31.000Z"
        data:
          type: array
          description: Documentos de esta página. Puede venir vacío.
          items:
            $ref: '#/components/schemas/DispatchFile'
        nextToken:
          type: string
          description: |
            Cursor de la página siguiente. **Presente solo si esta página
            trajo exactamente 100 elementos**, que es el límite fijo por
            página.

            Consecuencia a tolerar: un total de exactamente 100 resultados
            devuelve un `nextToken` cuya página siguiente viene **vacía**. La
            condición de corte es la ausencia de `nextToken`.
          example: SqboswZtrqP1mDJl6dFj
        unsignedCount:
          type: integer
          description: |
            Documentos de esta página cuya URL de descarga **no se pudo
            firmar**. Presente solo si es mayor que cero.

            Existe para que un fallo de firma no sea una degradación
            silenciosa: permite distinguir "este documento no tiene archivo"
            de "no se pudo generar su URL". Un archivo con permisos rotos no
            deja al integrador sin los otros 99. Si aparece de forma
            recurrente, conviene reportarlo con el `requestId`.
          example: 2

    FileType:
      type: object
      additionalProperties: false
      required: [id, name, tipoOperacion, responsableDoc]
      description: |
        Tipo documental habilitado en la agencia.

        **Las cuatro claves están siempre presentes.** A diferencia de
        `GET /dispatch/files`, este endpoint no elimina las propiedades sin
        valor: emite `null`. Un tipo documental con un campo sin cargar
        aparece igual en la lista.

        Los tamaños indicados abajo son **sugeridos**, no un límite que la
        API imponga: sirven para dimensionar las columnas de tu lado. Si un
        valor mal cargado en la agencia los excede, se devuelve completo en
        vez de recortado, para que el problema sea visible.
      properties:
        id:
          type: string
          description: |
            Identificador del tipo documental. Tamaño sugerido: **120**.
          example: 8kQpZ3mTn2VbYc7Lr5Xd
        name:
          type: [string, "null"]
          description: |
            Nombre del tipo documental. Es el mismo valor que acepta el
            parámetro `fileTypeName` de `GET /dispatch/files`, así que este
            endpoint es la forma de obtener esa lista sin fijarla en tu
            código. Tamaño sugerido: **64**.
          example: FACTURA AGENCIA
        tipoOperacion:
          type: [string, "null"]
          description: |
            Tipo de operación aduanera al que aplica el documento. Tamaño
            sugerido: **3**.
          example: IMP
        responsableDoc:
          type: [string, "null"]
          description: |
            Responsable de entregar el documento. Tamaño sugerido: **32**.
          example: AGENCIA

    FileTypesResponse:
      type: object
      additionalProperties: false
      required: [date, data]
      properties:
        date:
          type: string
          format: date-time
          description: |
            **Instante en que se sirvió la respuesta**, en ISO 8601 UTC. No
            es una fecha del dato.
          example: "2026-01-31T22:04:31.000Z"
        data:
          type: array
          description: |
            Tipos documentales **activos** que coinciden con el filtro,
            ordenados por `name`. Puede venir vacío.

            **No hay paginación**: el maestro se devuelve completo en una
            sola respuesta, sin `nextToken`. Es un catálogo de decenas de
            elementos, no un listado de operaciones.
          items:
            $ref: '#/components/schemas/FileType'
    DispatchStatus:
      type: object
      additionalProperties: false
      required:
        [id, numeroDespacho, recordType, EstadoDIN, EstadoDUS, isCompleted,
         dueStatus, priority, allowEdit, createdDate, lastModifiedDate,
         fechaEta, fechaLegalizacion]
      description: |
        Estado de seguimiento de un despacho.

        **A diferencia de los documentos, acá todas las claves están siempre
        presentes**: las que no tienen valor se emiten como `null` en lugar de
        desaparecer del JSON. Son dos contratos distintos a propósito, y
        conviene no asumir el de un endpoint al leer el otro.
      properties:
        id:
          type: string
          description: ID del despacho.
          example: "123457"
        numeroDespacho:
          type: [string, 'null']
          description: Número de despacho del negocio.
          example: "123457"
        recordType:
          type: [string, 'null']
          description: 'Tipo de registro. Valores observados: `din`, `dus`, `smda`.'
          example: din
        EstadoDIN:
          type: [string, 'null']
          description: Estado de la Declaración de Ingreso, en importaciones.
          example: ACEPTADA
        EstadoDUS:
          type: [string, 'null']
          description: Estado del Documento Único de Salida, en exportaciones.
          example: null
        isCompleted:
          type: boolean
          description: Si el despacho está cerrado. Cae a `false`.
          example: false
        dueStatus:
          type: [string, 'null']
          description: Estado respecto de su vencimiento.
          example: EN_PLAZO
        priority:
          type: [string, 'null']
          description: Prioridad asignada al despacho.
          example: ALTA
        allowEdit:
          type: boolean
          description: Si el despacho admite edición. Cae a `true`.
          example: true
        createdDate:
          type: [string, 'null']
          format: date-time
          description: Creación del registro, en ISO 8601 UTC.
          example: "2026-01-05T13:00:00.000Z"
        lastModifiedDate:
          type: [string, 'null']
          format: date-time
          description: Última modificación, en ISO 8601 UTC.
          example: "2026-01-18T09:10:00.000Z"
        fechaEta:
          type: [string, 'null']
          format: date-time
          description: ETA de la carga, en ISO 8601 UTC.
          example: "2026-01-22T00:00:00.000Z"
        fechaLegalizacion:
          type: [string, 'null']
          format: date-time
          description: Fecha de legalización, en ISO 8601 UTC.
          example: null

    DispatchStatusResponse:
      type: object
      additionalProperties: false
      required: [status, id, data]
      description: |
        Envelope del detalle. **No es el mismo que el de documentos**: acá no
        hay `date` ni paginación.
      properties:
        status:
          type: integer
          description: Código HTTP, repetido en el cuerpo.
          example: 200
        id:
          type: string
          description: ID del despacho consultado.
          example: "123457"
        data:
          $ref: '#/components/schemas/DispatchStatus'

    DispatchStatusListResponse:
      type: object
      additionalProperties: false
      required: [status, total, limit, data]
      description: |
        Envelope de la lista. **`total` es la cantidad devuelta en esta
        respuesta, no el total existente**: si es igual a `limit`, es probable
        que haya más y convenga pedir con un `limit` mayor o afinar los
        filtros. Este endpoint no tiene paginación por cursor.
      properties:
        status:
          type: integer
          example: 200
        total:
          type: integer
          description: Cantidad de elementos en `data`.
          example: 2
        limit:
          type: integer
          description: Límite aplicado a esta consulta.
          example: 50
        data:
          type: array
          items:
            $ref: '#/components/schemas/DispatchStatus'

  responses:
    BadRequest:
      description: |
        Parámetros inválidos. Ver el `code` del cuerpo para discriminar:
        `DISPATCH_ID_INVALID`, `RUT_NUMBER_INVALID`, `START_DATE_REQUIRED`,
        `END_DATE_REQUIRED`, `START_DATE_INVALID`, `END_DATE_INVALID`,
        `DATE_RANGE_INVALID`, `FILE_TYPE_NAME_INVALID`,
        `RECORD_TYPE_INVALID`, `NEXT_TOKEN_INVALID`, `PROJECT_ID_UNDEFINED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        API Key ausente, inválida, o no autorizada para el `idAgencia` de la
        ruta. Códigos: `API_KEY_INVALID`, `PROJECT_ID_UNAUTHORIZED`.

        La API responde **403**, no 401, también cuando la key falta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        El recurso no existe **o no pertenece a la cuenta del `rut`**.
        Códigos: `DISPATCH_NOT_FOUND` y `ACCOUNT_NOT_FOUND` (el RUT no es
        cliente o no está activo para esta API).

        Los dos casos del despacho —inexistente y de otra cuenta— devuelven
        la **misma** respuesta a propósito. Distinguirlos permitiría deducir,
        probando números correlativos, qué despachos existen en la agencia
        sin acceder a ninguno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: |
        Error del servidor. Códigos posibles:

        - `INTERNAL_ERROR` o un código de la capa de datos: error no
          controlado. Reintentar con back-off.
        - `TENANT_UNRESOLVED`: la configuración de tu agencia no se pudo
          resolver. **No es un error de tu request** — tu API Key y tu
          `idAgencia` son válidos. Reportar el `requestId` a soporte.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - ApiKeyQuery: []

paths:
  /dispatch/files/{numeroDespacho}:
    get:
      tags: [Documentación]
      operationId: listarDocumentosDespacho
      summary: Documentos de un despacho
      description: |
        Devuelve los documentos asociados a un **despacho específico**.
        `fileTypeName` es opcional: si se omite, se retornan todos los
        documentos del despacho.

        Es el único de los dos endpoints que puede devolver
        `dispatch.referencia`.

        ```
        GET https://api-comex.eurus.pro/{idAgencia}/v1/dispatch/files/{numeroDespacho}?key=...&rut=...
        ```
      parameters:
        - name: numeroDespacho
          in: path
          required: true
          schema:
            type: string
          description: |
            Número de despacho del negocio, sin dígito verificador. Se
            responde `404 DISPATCH_NOT_FOUND` si no existe en la agencia.
          example: "123457"
        - $ref: '#/components/parameters/RutParam'
        - $ref: '#/components/parameters/FileTypeNameOptional'
        - $ref: '#/components/parameters/NextTokenParam'
      responses:
        "200":
          description: Documentos del despacho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchFilesResponse'
              examples:
                todosLosDocumentos:
                  summary: Todos los documentos del despacho
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: SqboswZtrqP1mDJl6dFj
                        isActive: true
                        name: FACTURA AGENCIA
                        numeroDespacho: "123457"
                        dispatch:
                          id: "123457"
                          referencia: REF-DEMO-0001
                        infoDoc:
                          document:
                            number: "45"
                            type: FACTURA ELECTRONICA
                            issueDate: "2026-01-05"
                            dueDate: "2026-02-04"
                          issuer:
                            id: "888888888"
                            name: AGENCIA DEMO LTDA
                            address: AV. DEMO 1234
                          customer:
                            id: "999999999"
                            name: IMPORTADORA DEMO SPA
                        url: https://storage.googleapis.com/demo-bucket/files/45.pdf?X-Goog-Signature=...
                      - id: Kt91jZmQpLxvA2ncBd7Y
                        isActive: true
                        name: CONOCIMIENTO DE EMBARQUE (B/L)
                        numeroDespacho: "123457"
                        dispatch:
                          id: "123457"
                          referencia: REF-DEMO-0001
                        infoDoc:
                          document:
                            number: "BL-77021"
                            type: CONOCIMIENTO DE EMBARQUE
                        url: https://storage.googleapis.com/demo-bucket/files/bl-77021.pdf?X-Goog-Signature=...
                documentoMinimo:
                  summary: >-
                    Caso extremo — documento sin ningún campo poblado
                  description: |
                    Salida real para un documento vacío. Muestra el mínimo
                    garantizado: `dispatch` e `infoDoc` existen pero están
                    vacíos, y no hay `name`, `numeroDespacho` ni `url`.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: FILE-001
                        isActive: false
                        dispatch: {}
                        infoDoc: {}
                conFirmaFallida:
                  summary: Una URL no se pudo firmar
                  description: |
                    El segundo documento sale sin `url` y `unsignedCount`
                    vale 1, que es lo que permite distinguirlo de un
                    documento sin archivo.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: SqboswZtrqP1mDJl6dFj
                        isActive: true
                        name: FACTURA AGENCIA
                        dispatch:
                          id: "123457"
                        infoDoc:
                          document:
                            number: "45"
                        url: https://storage.googleapis.com/demo-bucket/files/45.pdf?X-Goog-Signature=...
                      - id: Zx44mNbVcXs1Qw2eRt5Y
                        isActive: true
                        name: NOTA DE COBRO
                        dispatch:
                          id: "123457"
                        infoDoc: {}
                    unsignedCount: 1
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /dispatch/files:
    get:
      tags: [Documentación]
      operationId: listarDocumentosPorTipoYFecha
      summary: Documentos por tipo y rango de fechas
      description: |
        Devuelve los documentos de **un tipo específico** (`fileTypeName`,
        obligatorio acá) de los despachos del cliente, dentro de un rango de
        fechas.

        Útil para procesos batch: por ejemplo, extraer todas las facturas de
        un mes para conciliación contable.

        Dos diferencias con el endpoint por despacho, ambas reales:

        - `fileTypeName` es **obligatorio**.
        - Nunca devuelve `dispatch.referencia`, porque no lee el documento
          del despacho.

        ```
        GET https://api-comex.eurus.pro/{idAgencia}/v1/dispatch/files?key=...&rut=...&startDate=...&endDate=...&fileTypeName=...
        ```
      parameters:
        - $ref: '#/components/parameters/RutParam'
        - $ref: '#/components/parameters/StartDateParam'
        - $ref: '#/components/parameters/EndDateParam'
        - $ref: '#/components/parameters/FileTypeNameRequired'
        - $ref: '#/components/parameters/NextTokenParam'
      responses:
        "200":
          description: Documentos del rango solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchFilesResponse'
              examples:
                facturasAgenciaEnero:
                  summary: Todas las "FACTURA AGENCIA" de enero 2026
                  description: |
                    Sin `dispatch.referencia`: este endpoint no la emite
                    nunca.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: SqboswZtrqP1mDJl6dFj
                        isActive: true
                        name: FACTURA AGENCIA
                        numeroDespacho: "123457"
                        dispatch:
                          id: "123457"
                        infoDoc:
                          document:
                            number: "45"
                            type: FACTURA ELECTRONICA
                            issueDate: "2026-01-05"
                        url: https://storage.googleapis.com/demo-bucket/files/45.pdf?X-Goog-Signature=...
                      - id: Nb77vCxZaS2dFg3hJk4L
                        isActive: true
                        name: FACTURA AGENCIA
                        numeroDespacho: "123458"
                        dispatch:
                          id: "123458"
                        infoDoc:
                          document:
                            number: "46"
                            type: FACTURA ELECTRONICA
                            issueDate: "2026-01-18"
                        url: https://storage.googleapis.com/demo-bucket/files/46.pdf?X-Goog-Signature=...
                paginaCompleta:
                  summary: Página completa, hay más resultados
                  description: |
                    La página trajo el máximo de 100 elementos (acá se
                    muestra uno), así que aparece `nextToken`. Se pide la
                    siguiente con `?nextToken=...`.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: SqboswZtrqP1mDJl6dFj
                        isActive: true
                        name: FACTURA AGENCIA
                        dispatch:
                          id: "123457"
                        infoDoc: {}
                    nextToken: SqboswZtrqP1mDJl6dFj
                sinResultados:
                  summary: Rango sin documentos de ese tipo
                  description: |
                    `data` vacío no es un error: es un `200` con cero
                    resultados.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data: []
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /master/file-types:
    get:
      tags: [Maestros]
      operationId: listarTiposDocumentales
      summary: Tipos documentales de la agencia
      description: |
        Devuelve el catálogo de **tipos documentales activos** de la agencia,
        opcionalmente filtrado por tipo de operación.

        Es la fuente de los valores que acepta el parámetro `fileTypeName`
        de `GET /dispatch/files`. Consultarlo una vez al inicio del proceso
        evita fijar la lista en el código: los tipos nuevos que la agencia
        habilite aparecen acá sin que tengas que desplegar nada.

        ```
        GET https://api-comex.eurus.pro/{idAgencia}/v1/master/file-types?key=...
        GET https://api-comex.eurus.pro/{idAgencia}/v1/master/file-types?key=...&recordType=impo
        ```

        Tres diferencias con los endpoints de `/dispatch/files`:

        - **No requiere `rut`**: el maestro es de la agencia, no de un
          cliente final.
        - **No pagina**: devuelve el catálogo completo, sin `nextToken`.
        - **No omite las claves sin valor**: emite `null`, así que la forma
          de cada elemento es siempre la misma.

        Solo se devuelven los tipos documentales **activos**. Uno dado de
        baja en la agencia desaparece de la lista, pero los documentos ya
        emitidos con ese tipo siguen consultándose por `fileTypeName`.
      parameters:
        - $ref: '#/components/parameters/MasterRecordTypeParam'
      responses:
        "200":
          description: Catálogo de tipos documentales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTypesResponse'
              examples:
                todos:
                  summary: Sin filtro — importación y exportación
                  description: |
                    Sin `recordType` se devuelven los tipos de ambas
                    operaciones, ordenados por `name`.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: 8kQpZ3mTn2VbYc7Lr5Xd
                        name: CERTIFICADO DE ORIGEN
                        tipoOperacion: IMP
                        responsableDoc: CLIENTE
                      - id: Lm4tRv9WqA1sEd6Fg2Hj
                        name: FACTURA AGENCIA
                        tipoOperacion: IMP
                        responsableDoc: AGENCIA
                      - id: Zx7Cv2Bn8Mk3Ql5Wt9Yu
                        name: MANIFIESTO DE EXPORTACION
                        tipoOperacion: EXP
                        responsableDoc: NAVIERA
                soloImportacion:
                  summary: Filtrado por `recordType=impo`
                  description: |
                    Solo los tipos documentales de importación.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: 8kQpZ3mTn2VbYc7Lr5Xd
                        name: CERTIFICADO DE ORIGEN
                        tipoOperacion: IMP
                        responsableDoc: CLIENTE
                      - id: Lm4tRv9WqA1sEd6Fg2Hj
                        name: FACTURA AGENCIA
                        tipoOperacion: IMP
                        responsableDoc: AGENCIA
                camposSinCargar:
                  summary: Un tipo documental con campos sin valor
                  description: |
                    Las claves no desaparecen: llegan en `null`. Verifica el
                    valor, no la presencia de la clave.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data:
                      - id: Zx7Cv2Bn8Mk3Ql5Wt9Yu
                        name: DOCUMENTO SIN CLASIFICAR
                        tipoOperacion: null
                        responsableDoc: null
                sinResultados:
                  summary: Agencia sin tipos documentales activos
                  description: |
                    `data` vacío no es un error: es un `200` con cero
                    resultados.
                  value:
                    date: "2026-01-31T22:04:31.000Z"
                    data: []
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: |
            Error no controlado. A diferencia de `/dispatch/*`, el `code` que
            emite **esta operación** es siempre `INTERNAL_ERROR`, con mensaje
            genérico: el detalle del fallo queda en los logs del servicio.
            Reintentar con back-off; si persiste, reportar el `requestId`.

            El `TENANT_UNRESOLVED` de la capa de autenticación es
            independiente de la operación y puede aparecer acá igual que en
            cualquier otro endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dispatch/status/{numeroDespacho}:
    get:
      tags: [Seguimiento]
      operationId: consultarEstadoDespacho
      summary: Estado de un despacho
      description: |
        Devuelve el estado de seguimiento de un **despacho específico**: tipo
        de registro, estado de la DIN o el DUS, fechas y prioridad.

        A diferencia de los endpoints de documentos, acá **todas las claves
        están siempre presentes**: las que no tienen valor se emiten como
        `null`.

        ```
        GET https://api-comex.eurus.pro/{idAgencia}/v1/dispatch/status/{numeroDespacho}?key=...&rut=...
        ```
      parameters:
        - name: numeroDespacho
          in: path
          required: true
          schema:
            type: string
          description: |
            Número de despacho del negocio. Se responde `404` si no existe en
            la agencia **o si no pertenece a la cuenta del `rut`**.
          example: "123457"
        - $ref: '#/components/parameters/RutParam'
      responses:
        "200":
          description: Estado del despacho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchStatusResponse'
              examples:
                importacionEnCurso:
                  summary: Importación aceptada, aún abierta
                  value:
                    status: 200
                    id: "123457"
                    data:
                      id: "123457"
                      numeroDespacho: "123457"
                      recordType: din
                      EstadoDIN: ACEPTADA
                      EstadoDUS: null
                      isCompleted: false
                      dueStatus: EN_PLAZO
                      priority: ALTA
                      allowEdit: true
                      createdDate: "2026-01-05T13:00:00.000Z"
                      lastModifiedDate: "2026-01-18T09:10:00.000Z"
                      fechaEta: "2026-01-22T00:00:00.000Z"
                      fechaLegalizacion: null
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /dispatch/status:
    get:
      tags: [Seguimiento]
      operationId: listarEstadosDespacho
      summary: Estados de tus despachos
      description: |
        Devuelve los despachos de la cuenta del `rut`, con filtros y
        ordenamiento opcionales.

        **Solo devuelve despachos de esa cuenta.** No hay forma de listar los
        de otro cliente.

        Este endpoint **no tiene paginación por cursor**: se acota con `limit`,
        que como máximo trae 200. Si `total` viene igual a `limit`, es probable
        que haya más resultados de los que estás viendo.

        Los filtros y el ordenamiento **fallan de forma silenciosa hacia el
        valor por defecto**: un `orderBy` desconocido o un `limit` fuera de
        rango no producen error, simplemente se ignoran.

        ```
        GET https://api-comex.eurus.pro/{idAgencia}/v1/dispatch/status?key=...&rut=...
        ```
      parameters:
        - $ref: '#/components/parameters/RutParam'
        - $ref: '#/components/parameters/RecordTypeParam'
        - $ref: '#/components/parameters/IsCompletedParam'
        - $ref: '#/components/parameters/StatusOrderByParam'
        - $ref: '#/components/parameters/StatusOrderDirectionParam'
        - $ref: '#/components/parameters/StatusLimitParam'
      responses:
        "200":
          description: Despachos de la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchStatusListResponse'
              examples:
                dosDespachos:
                  summary: Dos despachos abiertos
                  value:
                    status: 200
                    total: 2
                    limit: 50
                    data:
                      - id: "123457"
                        numeroDespacho: "123457"
                        recordType: din
                        EstadoDIN: ACEPTADA
                        EstadoDUS: null
                        isCompleted: false
                        dueStatus: EN_PLAZO
                        priority: ALTA
                        allowEdit: true
                        createdDate: "2026-01-05T13:00:00.000Z"
                        lastModifiedDate: "2026-01-18T09:10:00.000Z"
                        fechaEta: "2026-01-22T00:00:00.000Z"
                        fechaLegalizacion: null
                      - id: "123458"
                        numeroDespacho: "123458"
                        recordType: dus
                        EstadoDIN: null
                        EstadoDUS: EN_TRAMITE
                        isCompleted: false
                        dueStatus: EN_PLAZO
                        priority: null
                        allowEdit: true
                        createdDate: "2026-01-12T11:00:00.000Z"
                        lastModifiedDate: "2026-01-19T15:40:00.000Z"
                        fechaEta: null
                        fechaLegalizacion: null
                sinResultados:
                  summary: La cuenta no tiene despachos con esos filtros
                  value:
                    status: 200
                    total: 0
                    limit: 50
                    data: []
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
