name: Deploy to GitHub Pages

# CD: publica el sitio en cada merge a main.
#
# NOTA: este workflow NO lleva `paths-ignore`. Todo el contenido del portal
# son archivos .md, de modo que filtrar '**.md' impedía que un cambio de
# documentación llegara a publicarse.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Un solo deploy a la vez por ref. No se cancela en progreso: cancelar a
# mitad de un deploy de Pages puede dejar publicada una versión parcial.
#
# El grupo depende de la ref a propósito. Con un grupo fijo ('pages'), un
# workflow_dispatch desde una rama de feature entraba al mismo lock y, al no
# cancelarse en progreso, retrasaba un deploy real de main durante todo su
# build, aunque el job `deploy` se saltee por el `if`.
#
# Se prefiere esto a mover la concurrencia al job `deploy`: si el lock
# cubriera solo el deploy, dos pushes a main compilarían en paralelo y el
# orden de publicación podría invertirse, dejando publicado el commit más
# antiguo. Con el lock a nivel workflow y agrupado por ref, los pushes a
# main siguen serializándose de punta a punta y el orden se preserva.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # "22" resuelve a la última 22.x disponible, que siempre satisface el
          # >=22.12.0 que exige @redocly/cli: setup-node resuelve al latest de la
          # línea, nunca hacia atrás a 22.0-22.11. Fijar un parche exacto haría
          # que el CI corriera un Node más viejo y sin parches de seguridad.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mismos gates que CI: si el spec quedó inválido tras el merge, se
      # detiene antes de publicar.
      - name: Lint del spec OpenAPI
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build del sitio (es + en)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Guarda contra un workflow_dispatch lanzado desde una rama de feature:
    # solo main llega a publicarse.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
